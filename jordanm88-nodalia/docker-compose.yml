version: "3.7"

services:
  # Umbrel's own proxy. It publishes the manifest port (5137) on the host and forwards to the app
  # container below. NodaLia is the only thing that owns that port.
  app_proxy:
    environment:
      APP_HOST: jordanm88-nodalia_app_1
      APP_PORT: 5000
      # NodaLia has its own login (the first account registered becomes the admin), so Umbrel's extra
      # login wall in front of it is switched off. Remove this line to put it back.
      PROXY_AUTH_ADD: "false"

  app:
    # Published image (public on GitHub Container Registry), pinned to an exact build by digest so
    # installs are reproducible and an updated tag can't change what runs until this line changes.
    # To ship a new build: push the image, then update the tag + digest here and bump `version` in
    # umbrel-app.yml. (linux/amd64 only.)
    image: ghcr.io/jordanm88/nodalia:v0.1.134
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Tells NodaLia it is running on plain-HTTP Umbrel (no HTTPS redirect, relaxed local origins).
      UMBREL_MODE: "true"
      # Must match how you reach the app; port 5137 is the manifest port above.
      DOMAIN: http://${DEVICE_DOMAIN_NAME}:5137
      # Per-install secrets derived from your Umbrel seed: nothing sensitive is stored in this file.
      # The seed comes from exports.sh: this app's own, or for data copied from the old
      # "jordanm88-lia" listing (hooks/pre-install), that app's, so its encrypted data stays readable.
      NODALIA_DATA_SEED: ${APP_NODALIA_DATA_SEED}
      NODALIA_OWN_SEED: ${APP_SEED}
    # ENCRYPTION_KEY protects data in the database, so it must never change for an existing install.
    # SESSION_SECRET is derived from the same seed but with a different label, so the two secrets
    # are independent of each other. ($$ is compose's escape for a literal $.)
    command:
      - sh
      - -c
      - |
        SEED="$${NODALIA_DATA_SEED:-$$NODALIA_OWN_SEED}"
        if [ -f /app/data/.from-jordanm88-lia ] && [ "$$SEED" = "$$NODALIA_OWN_SEED" ]; then
          echo "This data was copied from the old NodaLia app but its encryption key wasn't passed in; not starting, so nothing is written with the wrong key. Restart the app from the Umbrel dashboard." >&2
          exit 1
        fi
        ENCRYPTION_KEY="$$SEED"
        SESSION_SECRET="$$(printf 'nodalia-session:%s' "$$SEED" | sha256sum | cut -d' ' -f1)"
        unset NODALIA_DATA_SEED NODALIA_OWN_SEED SEED
        export ENCRYPTION_KEY SESSION_SECRET
        exec node dist/docker-start.mjs
    volumes:
      # SQLite database
      - ${APP_DATA_DIR}/data/db:/app/data
      # Uploaded documents
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
