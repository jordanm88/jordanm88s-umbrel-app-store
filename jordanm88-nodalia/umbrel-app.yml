releaseNotes: >-
  Security and backup update. Two-factor codes can only be used once, Admin logs
  are kept when a user is deleted, Bunny.net storage uses encrypted (FTPS)
  connections, and stored data is re-encrypted with a stronger key the first time
  this version starts, older log entries included. Snapshots now include every
  stored file and value and are checked before download and restore; make a
  fresh snapshot after updating. The spreadsheet backup keeps every field. Once
  this version has started, older versions can no longer read your data, so
  don't roll back past it.
