version: "3.7"

services:
  lia:
    image: ghcr.io/jordanm88/lia:0.1.1
    container_name: jordanm88-lia
    ports: 
      - '5000:5000'
    restart: on-failure
    environment:
      ENCRYPTION_KEY: $APP_SEED
      SESSION_SECRET: $APP_SEED
      DOMAIN: http://${DEVICE_DOMAIN_NAME}:5000
      NODE_ENV: production
      CORS_BYPASS: yes
    volumes:
      - ${APP_DATA_DIR}/data/db:/app/data
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
