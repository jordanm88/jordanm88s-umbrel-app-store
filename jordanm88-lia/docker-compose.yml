version: "3.7"

services:
  # Umbrel's own proxy. It publishes the manifest port (5137) on the host and forwards to the app
  # container below. Lia is the only thing that owns that port.
  app_proxy:
    environment:
      APP_HOST: jordanm88-lia_app_1
      APP_PORT: 5000
      # Lia has its own login (the first account registered becomes the admin), so Umbrel's extra
      # login wall in front of it is switched off. Remove this line to put it back.
      PROXY_AUTH_ADD: "false"

  app:
    # Published image (public on GitHub Container Registry), pinned to an exact build by digest so
    # installs are reproducible and an updated tag can't change what runs until this line changes.
    # To ship a new build: push the image, then update the tag + digest here and bump `version` in
    # umbrel-app.yml. (linux/amd64 only.)
    image: ghcr.io/jordanm88/lia:0.1.74@sha256:ea0d1aaa436cb3e19bbc786f7656b805c858e2d98c9b27aa0162d680c0698d67
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Tells Lia it is running on plain-HTTP Umbrel (no HTTPS redirect, relaxed local origins).
      UMBREL_MODE: "true"
      # Must match how you reach the app; port 5137 is the manifest port above.
      DOMAIN: http://${DEVICE_DOMAIN_NAME}:5137
      # Per-install secrets derived from your Umbrel seed: nothing sensitive is stored in this file.
      # ENCRYPTION_KEY protects data in the database, so it must never change for an existing install.
      ENCRYPTION_KEY: ${APP_SEED}
      LIA_APP_SEED: ${APP_SEED}
    # SESSION_SECRET is derived from the same seed but with a different label, so the two secrets
    # are independent of each other. ($$ is compose's escape for a literal $.)
    command:
      - sh
      - -c
      - |
        SESSION_SECRET="$$(printf 'lia-session:%s' "$$LIA_APP_SEED" | sha256sum | cut -d' ' -f1)"
        export SESSION_SECRET
        exec node dist/docker-start.mjs
    volumes:
      # SQLite database
      - ${APP_DATA_DIR}/data/db:/app/data
      # Uploaded documents
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
