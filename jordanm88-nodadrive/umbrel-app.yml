releaseNotes: >-
  Network drives on Windows are steadier: big or slow copies no longer fail in
  File Explorer (files are uploaded in the background and shown meanwhile,
  carrying on after a restart), brief network drops are retried, names match
  whatever their case, and a file the server refuses is kept in Downloads.
  NodaDrive has a new mark throughout, and a name still set to "Cloud Drive"
  now shows NodaDrive. Moving a folder on S3 storage no longer fails when it
  holds an empty folder.
