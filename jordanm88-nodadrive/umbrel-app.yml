manifestVersion: 1
id: jordanm88-nodadrive
category: files
name: NodaDrive
version: "0.2.64"
tagline: Private drive for your WebDAV and S3 storage
icon: https://raw.githubusercontent.com/jordanm88/jordanm88s-umbrel-app-store/main/jordanm88-nodadrive/icon.png
description: >-
  A self-hosted file manager for WebDAV and S3-compatible storage, with sharing,
  previews, webmail, tasks, photos, notes and more. App data and its SQLite
  database stay on your Umbrel. The first account created becomes the admin.
  Admins can also add folders on the Umbrel itself (Home, USB drives and
  network shares) as storage.


  Moving from Cloud Drive ("jordanm88-cloud-drive")? Install NodaDrive first:
  installing moves Cloud Drive's data across. Then uninstall Cloud Drive.
developer: Jordan Mitchell
