releaseNotes: >-
  NodaDrive is now licensed through Nodalist Tech, like Lia: a new installation
  starts a 7-day trial, and an admin can check or request a licence in Admin →
  Licence. Without a valid licence NodaDrive turns read-only: everyone can still
  sign in, open and download their files, but nothing can be added or changed.
  On a server of its own, NodaDrive can now store files on that server's disk,
  always keeping part of it free for the system.
path: ""
