version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jordanm88-nodadrive_app_1
      APP_PORT: 4444
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/jordanm88/cloud-drive:0.2.60@sha256:3fe8a2c4840255910771ec7f5f6b8c30ebbd4062113a135c97a92137616242df
    restart: on-failure
    stop_grace_period: 1m
    init: true
    user: "0:0"
    environment:
      NODE_ENV: production
      PORT: "4444"
    command: ["node", "scripts/umbrel-start.mjs"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Umbrel folders offered as "Folder on this Umbrel" storage (admins only). rslave picks up USB drives and
      # network shares mounted after the app starts.
      - ${UMBREL_ROOT}/home:/umbrel/home
      - ${UMBREL_ROOT}/external:/umbrel/external:rslave
      - ${UMBREL_ROOT}/network:/umbrel/network:rslave
