tagline: Self-hosted insurance CRM for brokers and agents
icon: https://raw.githubusercontent.com/jordanm88/jordanm88s-umbrel-app-store/main/jordanm88-nodalia-demo/icon.png
description: >-
  Demo Version - NodaLia is a comprehensive, self-hosted insurance management platform built for
  brokers, agents, and small teams. Manage your entire book of business from
  a single, secure interface — no subscriptions, no data sharing.


  Features:

  👥 Client Management: Store and manage all client records with encrypted
  contact details, notes, and document attachments.


  📋 Policies & Quotes: Track policies across multiple lines of business,
  manage renewals, and generate quotes with full history.


  📁 Document Storage: Attach and organise policy documents, certificates, and
  correspondence directly against client and policy records.


  🔔 Tasks & Reminders: Built-in task management with due-date reminders to
  keep renewals, follow-ups, and compliance tasks on track.


  📊 Reports & Analytics: Dashboard insights into your pipeline, active book,
  and expiring policies at a glance.


  🔒 Security-first: All sensitive client data is encrypted at rest using
  AES-256 encryption. Full audit log tracks every action taken in the system.


  🛡️ Team Support: Multi-team architecture with role-based access control —
  admins, managers, and agents each see only what they need.


  The first account you register on first launch becomes the administrator.
