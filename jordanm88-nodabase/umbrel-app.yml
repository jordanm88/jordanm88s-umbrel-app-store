manifestVersion: 1
id: jordanm88-nodabase
storage:
  dataRoot: data
category: productivity
name: Nodabase
version: "0.1.3"
# Served from the (public) app store repo: this repo is private, so its raw files can't be loaded.
icon: https://raw.githubusercontent.com/jordanm88/jordanm88s-umbrel-app-store/main/jordanm88-nodabase/icon.png
tagline: Your data, connected — a self-hosted collaborative database
description: >-
  Nodabase is a self-hosted spreadsheet-meets-database app: workspaces,
  bases, tables, rich field types, formulas, views, charts, automations,
  forms and more — running entirely on your own hardware with a bundled
  PostgreSQL database and Redis for realtime coordination.

  The first user to register is granted admin rights automatically.
  All required secrets (JWT signing key, encryption-at-rest key) are
  generated on first boot and persisted to the app's data volume so they
  remain stable across container restarts.
releaseNotes: >-
  Backups you can count on: snapshots and automation backups now restore
  with their linked records and connections intact, scheduled snapshots run
  on time, and Excel snapshots no longer fail on unusual table names. Bases
  made from a template keep their own links. Admins' workspaces now start on
  Enterprise, and the logo's amber node comes alive.
