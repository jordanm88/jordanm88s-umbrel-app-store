version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jordanm88-cloud-drive_app_1
      APP_PORT: 4444
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/jordanm88/cloud-drive:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    init: true
    user: "0:0"
    environment:
      NODE_ENV: production
      PORT: "4444"
    command: ["node", "scripts/umbrel-start.mjs"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
