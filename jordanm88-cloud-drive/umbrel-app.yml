  - https://images-jm.b-cdn.net/cloud-drive/8.jpg
  - https://images-jm.b-cdn.net/cloud-drive/9.jpg
releaseNotes: >-
  Faster Documents: on a big drive, opening Documents could hold up the
  whole app for up to a minute; it now lists in under a second. Setting
  this up takes up to a minute once, the first time the app starts after
  updating. Also
  updated libraries (mail, spreadsheets, PDFs, the desktop and phone apps).
path: ""
