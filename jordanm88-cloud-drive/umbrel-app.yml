  - https://images-jm.b-cdn.net/cloud-drive/9.jpg
releaseNotes: >-
  Phone photo backup works again on phones that stopped sending photos (it
  could skip every photo without saying so); update the Android app too. If
  it can't read your photos, Settings → Photo backup now says why. Photos has
  a new Upload button for pictures and videos from your phone, WhatsApp
  included. Tidier toolbars on phones in Mail, Notes and Photos: the main
  buttons stay full size and the rest are under ⋯.
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Jordan Mitchell
