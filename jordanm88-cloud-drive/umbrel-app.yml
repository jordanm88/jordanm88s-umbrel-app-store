  - https://images-jm.b-cdn.net/cloud-drive/8.jpg
  - https://images-jm.b-cdn.net/cloud-drive/9.jpg
releaseNotes: >-
  Phone photo backup: update the Android app to this version. The backup fix
  from 0.2.55 never reached the phone apps, so phones kept skipping their
  photos. Photo dates: photos added with Upload in the Android app keep their
  own names, and the date that's often in them (they were renamed to numbers
  and dated the day they were uploaded), and backed-up photos with no date of
  their own are dated when the phone says they were taken.
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Jordan Mitchell
